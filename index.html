<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blindmaster Warehouse Bundy Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== BLINDMASTER BRAND SETTINGS – edit these to match the CI ===== */
  :root {
    --brand:        #404141;   /* Monument Grey - header band                   */
    --brand-text:   #ffffff;   /* white on Monument Grey                        */
    --accent:       #9dbcd0;   /* Pastel Blue                                   */
    --font:         Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* app colours */
    --bg:#e9e6e0; --card:#fafafa; --text:#000000; --muted:#404141;
    --in:#1a9b5a; --out:#d6452f; --warn:#b54708; --warnbg:#fff4e5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#404141; --card:#000000; --text:#ffffff; --muted:#e9e6e0; --warnbg:#3a2a12; --warn:#f6b660; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--card); width:100%; max-width:420px; border-radius:10px; overflow:hidden;
          text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.10); }
  .brandbar { background:var(--brand); color:var(--brand-text); padding:22px 20px 18px; }
  .lockup { display:inline-block; }
  .brandbar img { width:0; min-width:100%; height:auto; display:block; margin:0 0 12px; }
  .brandbar h1 { font-size:15px; font-weight:700; margin:0 -.06em 0 0; white-space:nowrap; letter-spacing:.06em; text-transform:uppercase; opacity:.92; }
  .body { padding:24px 22px 28px; }
  .clock { font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; }
  .date { color:var(--muted); margin-bottom:18px; }
  .state { font-size:16px; margin-bottom:18px; min-height:24px; }
  .state b { font-weight:700; }
  button.main { width:100%; padding:26px 10px; font-size:26px; font-weight:700; color:#fff; font-family:var(--font);
                border:0; border-radius:10px; cursor:pointer; letter-spacing:.04em; }
  button.main.in { background:var(--in); } button.main.out { background:var(--out); }
  button.main:disabled { opacity:.55; cursor:wait; }
  .totals { display:flex; gap:10px; margin-top:20px; }
  .totals div { flex:1; background:var(--bg); border-radius:12px; padding:12px 6px; border-top:3px solid var(--accent); }
  .totals span { display:block; color:var(--muted); font-size:12px; }
  .totals strong { font-size:20px; }
  .msg { margin-top:16px; padding:12px; border-radius:12px; font-size:14px; display:none; text-align:left; }
  .msg.ok { display:block; background:#e6f6ed; color:#14653c; }
  .msg.warn { display:block; background:var(--warnbg); color:var(--warn); }
  .msg.err { display:block; background:#fde2e2; color:#a12a1b; }
  input.pin { width:100%; padding:12px; font-size:18px; text-align:center; border-radius:10px;
              border:1px solid var(--muted); margin-bottom:14px; background:var(--card); color:var(--text); font-family:var(--font); }
</style>
</head>

      <h1>Warehouse Bundy Clock</h1>
    </div>
  </div>
  <div class="body">

  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date"></div>

  <input class="pin" id="pin" type="password" inputmode="numeric" placeholder="PIN" style="display:none">

  <div class="state" id="state">Checking status…</div>
  <button class="main in" id="btn" disabled>…</button>

  <div class="totals">
    <div><span>Today</span><strong id="today">–</strong></div>
  </div>
  <div class="msg" id="msg"></div>
  </div>
</div>

<script>
// 👉 Paste your Apps Script Web App URL here (ends in /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbwZ3msGiz4ZWcf6bY-KoqLSN0cR_s2oaprK-iHNUO_WYW7M6Y2d9GNAZj-hRYzzajrX/exec';

const $ = id => document.getElementById(id);
let clockedIn = false, busy = false;

/* live clock (Sydney time) */
function tick() {
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString('en-AU', { timeZone:'Australia/Sydney', hour12:false });
  $('date').textContent = now.toLocaleDateString('en-AU', { timeZone:'Australia/Sydney',
    weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
setInterval(tick, 1000); tick();

const hm = h => { const m = Math.round((h||0)*60); return Math.floor(m/60) + 'h ' + String(m%60).padStart(2,'0') + 'm'; };

function show(status) {
  clockedIn = status.clockedIn;
  $('state').innerHTML = clockedIn
    ? 'Clocked in since <b>' + status.since + '</b>'
    : 'You are <b>clocked out</b>';
  const b = $('btn');
  b.textContent = clockedIn ? 'CLOCK OUT' : 'CLOCK IN';
  b.className = 'main ' + (clockedIn ? 'out' : 'in');
  b.disabled = false;
  $('today').textContent = hm(status.todayHours);
  $('pin').style.display = status.pinRequired ? 'block' : 'none';
}

function message(text, type) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + type; }

async function api(payload) {
  const opts = payload
    ? { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(payload) }
    : {};
  const res = await fetch(API_URL, opts);
  return res.json();
}

async function loadStatus() {
  try { show(await api()); }
  catch (e) { $('state').textContent = 'Could not reach the server.'; message('Check your connection and refresh.', 'err'); }
}

function getPosition() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat:p.coords.latitude, lng:p.coords.longitude, accuracy:p.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
    );
  });
}

$('btn').addEventListener('click', async () => {
  if (busy) return;
  busy = true; $('btn').disabled = true;
  $('msg').className = 'msg';
  $('state').textContent = 'Getting your location…';

  const pos = await getPosition();
  if (!pos) message('Location unavailable – your time will still be recorded but flagged. Please allow location access for this site.', 'warn');
  $('state').textContent = 'Saving…';

  try {
    const r = await api({
      action: clockedIn ? 'OUT' : 'IN',
      pin: $('pin').value,
      lat: pos && pos.lat, lng: pos && pos.lng, accuracy: pos && pos.accuracy
    });
    if (!r.ok) {
      message(r.error, 'err');
      if (r.status) show(r.status); else loadStatus();
    } else {
      show(r.status);
      message('✔ ' + r.action + ' recorded at ' + r.time, 'ok');
    }
  } catch (e) {
    message('Could not save. Check your connection and try again.', 'err');
    loadStatus();
  }
  busy = false;
});

loadStatus();
</script>
</body>
</html>
